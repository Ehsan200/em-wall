name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make test

  build-macos:
    name: Build macOS DMG
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Resolve version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sync wails.json productVersion to tag
        run: |
          sed -i.bak 's/"productVersion": "[^"]*"/"productVersion": "'"$VERSION"'"/' app/wails.json
          rm app/wails.json.bak

      - name: Build .app bundle
        run: make app-bundle VERSION="$VERSION"

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG="dist/Em-Wall-${VERSION}.dmg"
          hdiutil create \
            -volname "Em Wall" \
            -srcfolder "app/build/bin/Em Wall.app" \
            -ov -format UDZO \
            "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            macOS build of Em Wall ${{ github.ref_name }}.

            ## Install

            1. Open the DMG and drag **Em Wall** into **Applications**.
            2. Launch it from Applications. macOS will block the first launch because the build is **unsigned**.
            3. Open **System Settings → Privacy & Security** (click here on macOS: [x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension](x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension)), scroll to the bottom, and click **Open Anyway** next to the Em Wall message. Confirm the second prompt with **Open**.
            4. Inside the app, the **Install** screen will run the LaunchDaemon installer (you'll get one standard admin prompt).

            ### Terminal shortcut

            If you'd rather skip the Privacy & Security dance, clear the quarantine flag once after dragging the app to Applications:

            ```
            xattr -dr com.apple.quarantine "/Applications/Em Wall.app"
            ```

            ## Platform support

            Linux and Windows builds are **not** produced. Em Wall is macOS-only: the daemon shells out to `pfctl`, `/sbin/route`, `scutil`, `networksetup`, and `osascript`, none of which exist on other platforms.
