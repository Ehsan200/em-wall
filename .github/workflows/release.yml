name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make test

  build-macos:
    name: Build macOS DMG
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # macos-latest ships with every Xcode version + all iOS/tvOS/watchOS
      # simulators preinstalled, leaving only a few GB free. hdiutil needs
      # scratch space for an uncompressed UDRW staging volume before producing
      # the final UDZO .dmg, and was hitting ENOSPC mid-copy. Reclaim ~30+ GB
      # by deleting tooling we don't use in this build.
      #
      # `rm -rf` on the Xcode apps walks millions of tiny files and is the
      # slowest part of the run, so kick the deletes off in the background and
      # let the Go/Node/Wails setup steps below run concurrently. We `wait` on
      # the marker right before packaging, which is the first step that needs
      # the reclaimed space.
      - name: Free disk space (background)
        run: |
          nohup sudo sh -c '
            rm -rf /Applications/Xcode_*.app &
            rm -rf ~/Library/Developer/CoreSimulator &
            rm -rf /Library/Developer/CoreSimulator &
            rm -rf "'"$ANDROID_HOME"'" &
            wait
          ' >/tmp/free-disk.log 2>&1 &
          echo $! >/tmp/free-disk.pid

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Resolve version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sync wails.json productVersion to tag
        run: |
          sed -i.bak 's/"productVersion": "[^"]*"/"productVersion": "'"$VERSION"'"/' app/wails.json
          rm app/wails.json.bak

      - name: Build .app bundle
        run: make app-bundle VERSION="$VERSION"

      - name: Wait for disk cleanup
        run: |
          set -euo pipefail
          # Block until the background reclaim finishes (BSD tail on macOS has
          # no --pid, so poll the pid instead).
          if [ -f /tmp/free-disk.pid ]; then
            PID="$(cat /tmp/free-disk.pid)"
            while kill -0 "$PID" 2>/dev/null; do sleep 2; done
          fi
          cat /tmp/free-disk.log || true
          df -h /

      - name: Package DMG
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG="dist/Em-Wall-${VERSION}.dmg"
          # Stage the volume contents so the DMG shows the app next to
          # an /Applications symlink for drag-to-install.
          STAGE="$(mktemp -d)/Em Wall"
          mkdir -p "$STAGE"
          cp -R "app/build/bin/Em Wall.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Em Wall" \
            -srcfolder "$STAGE" \
            -ov -format UDZO \
            "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            macOS build of Em Wall ${{ github.ref_name }}.

            ## Install

            1. Open the DMG and drag **Em Wall** into **Applications**.
            2. Launch it from Applications. macOS will block the first launch because the build is **unsigned**.
            3. Open Privacy & Security in System Settings — easiest way is to paste this in Terminal:
               ```
               open "x-apple.systempreferences:com.apple.settings.PrivacySecurity.extension"
               ```
               Scroll to the bottom of the pane and click **Open Anyway** next to the Em Wall message, then confirm with **Open**.
            4. Inside the app, the **Install** screen will run the LaunchDaemon installer (one standard admin prompt).

            ### Terminal shortcut

            Skip the Privacy & Security pane entirely by clearing the quarantine flag after dragging the app to Applications:

            ```
            xattr -dr com.apple.quarantine "/Applications/Em Wall.app"
            ```

            ## Upgrading

            Already running a previous build? You don't need this DMG. When a newer
            release exists, the app shows an **Update available** banner — click
            **Download & install** and it fetches this DMG, swaps the app in place,
            and relaunches automatically. After it restarts, a **Daemon version
            mismatch** banner appears: click **Reinstall daemon** (one admin prompt)
            to update the bundled daemon to match. Done.

            Manual fallback: replace **Em Wall.app** in Applications with this build,
            then open **Settings** and run **ReInstall** so the bundled daemon matches.

            ## Platform support

            Linux and Windows builds are **not** produced. Em Wall is macOS-only: the daemon shells out to `pfctl`, `/sbin/route`, `scutil`, `networksetup`, and `osascript`, none of which exist on other platforms.
