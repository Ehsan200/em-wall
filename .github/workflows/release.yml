name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test core
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: make test

  build-macos:
    name: Build macOS DMG
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build .app bundle
        run: make app-bundle

      - name: Package DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          DMG="dist/Em-Wall-${VERSION}.dmg"
          hdiutil create \
            -volname "Em Wall" \
            -srcfolder "app/build/bin/Em Wall.app" \
            -ov -format UDZO \
            "$DMG"
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            macOS build of Em Wall ${{ github.ref_name }}.

            The DMG is **unsigned** — on first launch macOS will block it. Either right-click the app and choose **Open**, or run `xattr -dr com.apple.quarantine "/Applications/Em Wall.app"` after dragging it to Applications.

            Linux and Windows builds are not produced: Em Wall is macOS-only (the daemon depends on `pfctl`, `/sbin/route`, `scutil`, `networksetup`, and `osascript`).
